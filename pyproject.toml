[project]
name = "cache-test"
version = "0.1.0"
description = "Caching microservice that generates interleaved payloads from transformed strings"
readme = "README.md"
authors = [
    { name = "Ajibade Yakub", email = "ajibadeyakubadebare@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
cache-test = "cache_test.main:run"
cache-cli = "cache_test.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
