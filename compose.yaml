services:
  cache-test:
    build: .
    image: cache-test
    ports:
      # Host port 8765, because 8000 is often taken locally; the app listens on 8000.
      - "8765:8000"
    environment:
      CACHE_TEST_TRANSFORMER_DELAY_SECONDS: "0.1"
      # Taken from your shell or a .env file. Whenever a key is set, it's enforced.
      CACHE_TEST_API_KEY: ${CACHE_TEST_API_KEY:-}
      # Set to true to refuse to start without a key (recommended beyond local use).
      CACHE_TEST_API_KEY_REQUIRED: ${CACHE_TEST_API_KEY_REQUIRED:-false}
    volumes:
      # The SQLite database lives here, so the cache survives restarts.
      - cache-data:/data
    restart: unless-stopped

volumes:
  cache-data:
